name: ai_sandbox
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.4
  url_launcher: ^6.3.0
  sqflite: ^2.3.0
  path: ^1.8.3
